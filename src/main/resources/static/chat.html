<!DOCTYPE html>

<html lang="en">
<head>
    <title>Chat Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .container {
            width: 450px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
        .chat-header{
            margin:15px 0;
            padding:12px;
            background:#f5f5f5;
            border-radius:8px;
            font-weight:bold;
            color:#444;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 95%;
            padding: 10px;
            margin-top: 10px;
        }

        button {
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            cursor: pointer;
        }

        #messages {
            margin-top: 20px;
            border: 1px solid #ddd;
            height: 350px;
            overflow-y: auto;
            padding: 10px;
            background: #fafafa;
        }

        .message {
            display: flex;
            margin-bottom: 10px;
        }

        .sent {
            justify-content: flex-end;
        }

        .received {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 70%;
            padding: 10px;
            border-radius: 12px;
        }

        .sent .bubble {
            background: #4CAF50;
            color: white;
        }

        .received .bubble {
            background: #e5e5e5;
            color: black;
        }
        .header{
            display:flex;
            justify-content:flex-end;
            margin-bottom:10px;
        }

        .logout-btn{
            background:#dc3545;
            color:white;
            border:none;
            padding:8px 16px;
            border-radius:5px;
            cursor:pointer;
        }

        .logout-btn:hover{
            background:#b52b3a;
        }
        .time{
            margin-top:6px;
            font-size:12px;
            opacity:0.7;
            text-align:right;
        }

    </style>
</head>
<body>
<div class="container">
    <h2>Real Time Chat</h2>
    <h3 id="loggedUser"></h3>
    <div class="header">
        <button onclick="logout()" class="logout-btn">
            Logout
        </button>
    </div>
    <label for="receiver">Receiver</label>
    <input
            id="receiver"
            placeholder="Receiver"
            oninput="updateChatHeader()"
            onchange="loadHistory()">

    <div id="chatHeader" class="chat-header">
        Select a user to start chatting
    </div>
    <div id="messages"></div>
    <label for="message">Message</label>

    <input
            id="message"
            placeholder="Type your message..."
            onkeypress="handleKeyPress(event)">
    <button onclick="sendMessage()">
   Send
    </button>
</div>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script>
    let stompClient = null;
    const token = localStorage.getItem("token");
    const email = localStorage.getItem("email");
    if (!token || !email) {
        window.location.href = "login.html";
    }

    function connect() {
        let socket = new SockJS('/chat');
        stompClient = Stomp.over(socket);
        stompClient.connect(
            {
                Authorization: "Bearer " + localStorage.getItem("token")
            },
            function () {

                stompClient.subscribe("/user/queue/messages", function(message){
                    showMessage(JSON.parse(message.body));
                });

            }
        );
    }

    function sendMessage() {
        const sender = localStorage.getItem("email");
        const receiver = document.getElementById("receiver").value;
        const content = document.getElementById("message").value.trim();
        if (receiver === "") {
            alert("Please enter a receiver.");
            return;
        }
        if(content === ""){
            return;
        }
        if (!stompClient || !stompClient.connected) {
            alert("Chat server is not connected. Please refresh the page.");
            return;
        }
        stompClient.send("/app/chat", {}, JSON.stringify({
            sender,
            receiver,
            content
        }));
        document.getElementById("message").value = "";
        document.getElementById("message").focus();
    }

    function showMessage(message) {
        const messages = document.getElementById("messages");
        const loggedInUser = localStorage.getItem("email");
        const sender = message.sender || message.senderEmail;
        const messageClass =
            sender === loggedInUser ? "sent" : "received";
        let time = "";
        if(message.timestamp){
            time = new Date(message.timestamp).toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit"
            });
        }
        messages.innerHTML += `
        <div class="message ${messageClass}">
            <div class="bubble">
                <strong>${sender}</strong><br>
                ${message.content}
                <div class="time">${time}</div>
            </div>
        </div>
    `;
        messages.scrollTop = messages.scrollHeight;
    }
    async function loadHistory() {
        const receiver = document.getElementById("receiver").value.trim();
        if (receiver === "") {
            document.getElementById("messages").innerHTML = "";
            return;
        }
        try {
            const token = localStorage.getItem("token");
            const response = await fetch(
                "/messages/history/" + receiver,
                {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                }
            );
            if (!response.ok) {
                throw new Error("Failed to load chat history");
            }
            const history = await response.json();
            const messages = document.getElementById("messages");
            messages.innerHTML = "";
            history.forEach(showMessage);
            messages.scrollTop = messages.scrollHeight;
        } catch (error) {
            console.error("Error loading history:", error);
            document.getElementById("messages").innerHTML =
                "<p style='color:red'>Unable to load chat history.</p>";
        }
    }

    connect();
    document.getElementById("loggedUser").innerHTML =
        "Logged in as : " +
        localStorage.getItem("email");
    function logout() {
        if (stompClient && stompClient.connected) {
            stompClient.disconnect(() => {

            });
        }
        localStorage.clear();
        window.location.href = "login.html";
    }
    function updateChatHeader() {
        const receiver = document.getElementById("receiver").value;
        const header = document.getElementById("chatHeader");
        if(receiver.trim() === ""){
            header.innerHTML = "Select a user to start chatting";
        }else{
            header.innerHTML = "Chatting with <b>" + receiver + "</b>";
        }
    }
    function handleKeyPress(event){

        if(event.key === "Enter"){
            sendMessage();
        }

    }
</script>
</body>
</html>
